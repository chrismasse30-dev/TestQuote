        const PARTNER_LEVELS = [
            { id: 'silver', name: 'Silver Partner', discount: 15, column: 'Silver Partner 15%' },
            { id: 'gold', name: 'Gold Partner', discount: 25, column: 'Gold Partner 25%' },
            { id: 'platinum', name: 'Platinum Partner', discount: 35, column: 'Platinum Partner 35%' }
        ];

        function QuotingTool() {
            const [step, setStep] = useState(0);
            const [showDistributedDialog, setShowDistributedDialog] = useState(false);
            const [quoteData, setQuoteData] = useState({
                customerName: '', projectName: '', partnerLevel: 'silver', salesRep: '',
                projectType: '', estimatedDoors: '', mdfLocation: '', numIDFs: '', cabinetVendor: '',
                autoCalculateHardware: true, useDistributedArchitecture: false,
                signo20Readers: '', signo40Readers: '', items: []
            });
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [savedQuotes, setSavedQuotes] = useState([]);

            useEffect(() => { loadSavedQuotes(); }, []);

            const loadSavedQuotes = async () => {
                try {
                    const result = await window.storage.list('quote:', false);
                    if (result && result.keys) setSavedQuotes(result.keys);
                } catch (error) { console.log('No saved quotes yet'); }
            };

            const saveQuoteJSON = async () => {
                const quoteJSON = JSON.stringify(quoteData, null, 2);
                const blob = new Blob([quoteJSON], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Quote_${quoteData.projectName}_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const addItem = (product) => {
                setQuoteData(prev => ({ ...prev, items: [...prev.items, { ...product, quantity: 1, id: Date.now() }] }));
            };

            const updateQuantity = (id, quantity) => {
                setQuoteData(prev => ({
                    ...prev,
                    items: prev.items.map(item => item.id === id ? { ...item, quantity: parseInt(quantity) || 0 } : item)
                }));
            };

            const removeItem = (id) => {
                setQuoteData(prev => ({ ...prev, items: prev.items.filter(item => item.id !== id) }));
            };

            const getPrice = (product) => {
                const level = PARTNER_LEVELS.find(l => l.id === quoteData.partnerLevel);
                return product[level.column] || product.MSRP;
            };

            const calculateSubtotal = () => {
                return quoteData.items.filter(item => !item['Product Code'].startsWith('SF-')).reduce((sum, item) => sum + (getPrice(item) * item.quantity), 0);
            };

            const calculateTotal = () => {
                return quoteData.items.reduce((sum, item) => sum + (getPrice(item) * item.quantity), 0);
            };

            const filteredProducts = PRODUCTS.filter(p => {
                const matchesSearch = p.Description.toLowerCase().includes(searchTerm.toLowerCase()) || p['Product Code'].toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = selectedCategory === 'All' || p.poe === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            const categories = ['All', ...new Set(PRODUCTS.map(p => p.poe))];

            const calculateSetupFee = (quoteTotal) => {
                const total = parseFloat(quoteTotal) || 0;
                if (total === 0) return null;
                if (total < 10000) return { sku: 'SF-L1', name: 'Set-up Fee - Level One', reason: 'Quote total under $10,000' };
                if (total < 25000) return { sku: 'SF-L2', name: 'Set-up Fee - Level Two', reason: 'Quote total $10,000 - $24,999' };
                return { sku: 'SF-L3', name: 'Set-up Fee - Level Three', reason: 'Quote total $25,000+' };
            };

            const calculateDoorLicenses = (numDoors) => {
                const doors = parseInt(numDoors) || 0;
                if (doors === 0) return [];
                const licenses = [];
                if (doors >= 1) licenses.push({ sku: 'AC-EL1', quantity: 1, coverage: 'Access Control License (1-10 doors)' });
                if (doors > 10) licenses.push({ sku: 'AC-EL2', quantity: Math.min(doors - 10, 20), coverage: `Access Control License (11-${10 + Math.min(doors - 10, 20)} doors)` });
                if (doors > 30) licenses.push({ sku: 'AC-EL3', quantity: Math.min(doors - 30, 70), coverage: `Access Control License (31-${30 + Math.min(doors - 30, 70)} doors)` });
                if (doors > 100) licenses.push({ sku: 'AC-EL4', quantity: doors - 100, coverage: `Access Control License (100+ doors)` });
                return licenses;
            };

            const calculateRequiredHardware = (numDoors) => {
                const doors = parseInt(numDoors) || 0;
                if (doors === 0 || quoteData.projectType !== 'new') return { mp1502: 0, mr52s3b: 0, warning: null };
                const optimal = quoteData.cabinetVendor ? getOptimalCabinet(doors, quoteData.cabinetVendor) : null;
                const numCabinets = optimal ? optimal.length : 1;
                if (quoteData.useDistributedArchitecture && numCabinets > 1) {
                    const doorsPerCabinet = Math.ceil(doors / numCabinets);
                    if (doorsPerCabinet > 64) return { mp1502: 0, mr52s3b: 0, warning: `Each cabinet would need ${doorsPerCabinet} doors (exceeds 64-door limit per MP1502). Add more cabinets or use centralized architecture.` };
                    let mr52PerCabinet = 0;
                    if (doorsPerCabinet > 2) mr52PerCabinet = Math.ceil((doorsPerCabinet - 2) / 2);
                    return { mp1502: numCabinets, mr52s3b: mr52PerCabinet * numCabinets, distributed: true, cabinetCount: numCabinets, doorsPerCabinet: doorsPerCabinet, warning: null };
                }
                const controllersNeeded = Math.ceil(doors / 64);
                let totalMr52s3b = 0;
                for (let i = 0; i < controllersNeeded; i++) {
                    const doorsForThisController = Math.min(64, doors - (i * 64));
                    if (doorsForThisController > 2) totalMr52s3b += Math.ceil((doorsForThisController - 2) / 2);
                }
                return { mp1502: controllersNeeded, mr52s3b: totalMr52s3b, centralized: controllersNeeded > 1, warning: null };
            };

            const getOptimalCabinet = (numDoors, vendor) => {
                const doors = parseInt(numDoors) || 0;
                if (doors === 0 || !vendor) return null;
                if (vendor === 'lsp') {
                    if (doors <= 2) return [{ sku: 'FPO75-B100C4PE1M', name: 'LSP 2 Door Enclosure', quantity: 1, coverage: '2 doors', reason: 'Compact solution for small installation' }];
                    if (doors <= 4) return [{ sku: 'FPO75-B100C4D8PE2M', name: 'LSP 4 Door Enclosure', quantity: 1, coverage: '4 doors', reason: 'Standard 4-door power enclosure' }];
                    if (doors <= 8) return [{ sku: 'FPO150-B100C8D8PE6M', name: 'LSP 8 Door Enclosure - Medium', quantity: 1, coverage: '8 doors', reason: 'Medium size provides optimal space' }];
                    if (doors <= 16) return [{ sku: 'FPO150/250-2C82D8PE6M1', name: 'LSP 16 Door Enclosure - Medium', quantity: 1, coverage: '16 doors', reason: 'Best balance of capacity and space' }];
                    if (doors <= 24) return [{ sku: 'FPO250/250-3C83D8PE12M', name: 'LSP 24 Door Enclosure', quantity: 1, coverage: '24 doors', reason: 'High-capacity dual voltage system' }];
                    if (doors <= 40) return [
                        { sku: 'FPO250/250-3C83D8PE12M', name: 'LSP 24 Door Enclosure', quantity: 1, coverage: '24 doors (primary)', reason: 'Primary cabinet' },
                        { sku: 'FPO150/250-2C82D8PE6M1', name: 'LSP 16 Door Enclosure - Medium', quantity: 1, coverage: `${doors - 24} additional doors`, reason: 'Secondary cabinet for expansion' }
                    ];
                    if (doors <= 48) return [{ sku: 'FPO250/250-3C83D8PE12M', name: 'LSP 24 Door Enclosure', quantity: 2, coverage: `${doors} doors total`, reason: 'Dual cabinet configuration' }];
                    if (doors <= 66) {
                        const remaining = doors - 48;
                        if (remaining <= 8) return [
                            { sku: 'FPO250/250-3C83D8PE12M', name: 'LSP 24 Door Enclosure', quantity: 2, coverage: '48 doors', reason: 'Primary cabinets' },
                            { sku: 'FPO150-B100C8D8PE6M', name: 'LSP 8 Door Enclosure - Medium', quantity: 1, coverage: `${remaining} additional doors`, reason: 'Tertiary cabinet' }
                        ];
                        return [
                            { sku: 'FPO250/250-3C83D8PE12M', name: 'LSP 24 Door Enclosure', quantity: 2, coverage: '48 doors', reason: 'Primary cabinets' },
                            { sku: 'FPO150/250-2C82D8PE6M1', name: 'LSP 16 Door Enclosure - Medium', quantity: 1, coverage: `${remaining} additional doors`, reason: 'Tertiary cabinet' }
                        ];
                    }
                    const cabinets = [];
                    let remainingDoors = doors;

                                        <div><div className="text-sm font-semibold text-slate-500 mb-1">Total Doors</div><div className="text-lg text-slate-900">{quoteData.estimatedDoors}</div><div className="text-xs text-slate-500">Openings, gates, OHD</div></div>
                                        <div><div className="text-sm font-semibold text-slate-500 mb-1">MDF Location</div><div className="text-lg text-slate-900">{quoteData.mdfLocation || 'Not specified'}</div><div className="text-xs text-slate-500">Main Distribution Frame</div></div>
                                        <div><div className="text-sm font-semibold text-slate-500 mb-1">Number of IDFs</div><div className="text-lg text-slate-900">{quoteData.numIDFs || '0'}</div><div className="text-xs text-slate-500">Intermediate Distribution Frames</div></div>
                                        <div>
                                            <div className="text-sm font-semibold text-slate-500 mb-1">Cabinet System</div>
                                            <div className="text-lg text-slate-900">{quoteData.cabinetVendor === 'lsp' && 'LSP (LifeSafety Power)'}{quoteData.cabinetVendor === 'altronix' && 'Altronix Trove'}{!quoteData.cabinetVendor && <span className="text-slate-500">Not selected</span>}</div>
                                            <div className="text-xs text-slate-500">Power/enclosure system</div>
                                        </div>
                                        <div>
                                            <div className="text-sm font-semibold text-slate-500 mb-1">Card Readers</div>
                                            <div className="text-sm text-slate-900">
                                                {parseInt(quoteData.signo20Readers) > 0 && <div>Signo 20: {quoteData.signo20Readers}</div>}
                                                {parseInt(quoteData.signo40Readers) > 0 && <div>Signo 40: {quoteData.signo40Readers}</div>}
                                                {!parseInt(quoteData.signo20Readers) && !parseInt(quoteData.signo40Readers) && <div className="text-slate-500">None specified</div>}
                                            </div>
                                            <div className="text-xs text-slate-500">Standard readers</div>
                                        </div>
                                    </div>

                                    {quoteData.projectType === 'new' && quoteData.estimatedDoors > 0 && (() => {
                                        const licenses = calculateDoorLicenses(quoteData.estimatedDoors);
                                        if (licenses.length === 0) return null;
                                        return (
                                            <div className="mb-6 p-5 bg-green-50 border-2 border-green-200 rounded-xl">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <svg className="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
                                                    <h4 className="font-bold text-green-900">Genea Access Control Licenses</h4>
                                                </div>
                                                <div className="text-sm text-green-800 mb-3">The following software licenses are automatically included for {quoteData.estimatedDoors} doors:</div>
                                                <div className="space-y-2">
                                                    {licenses.map((license, idx) => (
                                                        <div key={idx} className="bg-white border border-green-300 rounded-lg p-3">
                                                            <div className="flex justify-between items-center">
                                                                <div><div className="font-semibold text-slate-900">{license.sku}</div><div className="text-xs text-slate-600">{license.coverage}</div></div>
                                                                <div className="text-right"><div className="font-bold text-green-700">Qty: {license.quantity}</div></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className="mt-3 p-3 bg-green-100 border border-green-300 rounded-lg"><div className="text-xs text-green-900"><span className="font-semibold">💡 Note:</span> License fees are tiered based on door count. These have been automatically added to your quote.</div></div>
                                            </div>
                                        );
                                    })()}

                                    {quoteData.projectType === 'new' && calculateSubtotal() > 0 && (() => {
                                        const setupFee = calculateSetupFee(calculateSubtotal());
                                        if (!setupFee) return null;
                                        return (
                                            <div className="mb-6 p-5 bg-orange-50 border-2 border-orange-200 rounded-xl">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <svg className="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                                    <h4 className="font-bold text-orange-900">Setup & Installation Fee</h4>
                                                </div>
                                                <div className="text-sm text-orange-800 mb-3">Based on your project size (${calculateSubtotal().toFixed(2)} subtotal), the following setup fee applies:</div>
                                                <div className="bg-white border border-orange-300 rounded-lg p-3">
                                                    <div className="flex justify-between items-center">
                                                        <div><div className="font-semibold text-slate-900">{setupFee.name}</div><div className="text-xs text-slate-600">{setupFee.reason}</div></div>
                                                        <div className="text-right">
                                                            <div className="font-bold text-orange-700">
                                                                ${(() => { const setupProduct = PRODUCTS.find(p => p['Product Code'] === setupFee.sku); return setupProduct ? getPrice(setupProduct).toFixed(2) : '0.00'; })()}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="mt-3 p-3 bg-orange-100 border border-orange-300 rounded-lg"><div className="text-xs text-orange-900"><span className="font-semibold">💡 Note:</span> Setup fees are automatically calculated based on total project value and include system configuration, testing, and commissioning.</div></div>
                                            </div>
                                        );
                                    })()}

                                    <div className="mb-6">
                                        <h3 className="text-xl font-bold text-slate-900 mb-4">Line Items</h3>
                                        <div className="space-y-3">
                                            {quoteData.items.map(item => (
                                                <div key={item.id} className="flex justify-between items-start p-4 bg-slate-50 rounded-lg">
                                                    <div className="flex-1">
                                                        <div className="font-semibold text-slate-900">{item.Description}</div>
                                                        <div className="text-sm text-slate-600">{item['Product Code']}</div>
                                                        <div className="text-sm text-slate-600 mt-1">Qty: {item.quantity}</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-sm text-slate-600">${getPrice(item).toFixed(2)} ea</div>
                                                        <div className="font-bold text-slate-900">${(getPrice(item) * item.quantity).toFixed(2)}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        
                                        {quoteData.projectType === 'new' && quoteData.estimatedDoors && quoteData.cabinetVendor && (() => {
                                            const optimal = getOptimalCabinet(quoteData.estimatedDoors, quoteData.cabinetVendor);
                                            if (!optimal) return null;
                                            const hasCabinet = quoteData.items.some(item => optimal.some(cab => cab.sku === item['Product Code']));
                                            if (!hasCabinet) {
                                                return (
                                                    <div className="mt-4 p-4 bg-amber-50 border-2 border-amber-300 rounded-lg">
                                                        <div className="text-sm font-semibold text-amber-900 mb-2">⚠️ Recommended: Add Cabinet/Enclosure</div>
                                                        <div className="text-xs text-amber-800 mb-3">Your selected {quoteData.cabinetVendor === 'lsp' ? 'LSP' : 'Altronix Trove'} system configuration for {quoteData.estimatedDoors} doors:</div>
                                                        <div className="space-y-2">{optimal.map((cab, idx) => (<div key={idx} className="text-xs text-amber-900 bg-amber-100 p-2 rounded">• {cab.quantity}x {cab.name} - {cab.coverage}</div>))}</div>
                                                    </div>
                                                );
                                            }
                                            return null;
                                        })()}
                                    </div>

                                    <div className="pt-6 border-t-2 border-slate-200">
                                        <div className="flex justify-between items-center mb-2"><div className="text-lg font-semibold text-slate-900">Subtotal</div><div className="text-2xl font-bold text-slate-900">${calculateSubtotal().toFixed(2)}</div></div>
                                        {(() => {
                                            const setupFeeItem = quoteData.items.find(item => item.isSetupFee);
                                            if (setupFeeItem) {
                                                return (
                                                    <div className="flex justify-between items-center mb-2 py-2 border-t border-slate-200">
                                                        <div className="text-sm text-slate-700">{setupFeeItem.Description}<div className="text-xs text-slate-500">Based on project size</div></div>
                                                        <div className="text-lg font-semibold text-orange-700">${(getPrice(setupFeeItem) * setupFeeItem.quantity).toFixed(2)}</div>
                                                    </div>
                                                );
                                            }
                                            return null;
                                        })()}
                                        <div className="flex justify-between items-center pt-3 border-t-2 border-slate-300"><div className="text-xl font-bold text-slate-900">Total</div><div className="text-3xl font-bold text-emerald-700">${calculateTotal().toFixed(2)}</div></div>
                                        <div className="text-sm text-emerald-700 text-right mt-1">Partner Discount: {level.discount}% applied</div>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <input type="file" accept=".json" onChange={loadQuote} id="load-quote" className="hidden" />
                                    <label htmlFor="load-quote" className="flex-1 flex items-center justify-center gap-2 px-6 py-4 bg-slate-600 text-white rounded-xl hover:bg-slate-700 transition-all font-semibold text-lg cursor-pointer">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                        Load Quote
                                    </label>
                                    <button onClick={saveQuoteJSON} className="flex-1 flex items-center justify-center gap-2 px-6 py-4 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all font-semibold text-lg">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                                        Save Quote (JSON)
                                    </button>
                                    <button onClick={downloadQuote} className="flex-1 flex items-center justify-center gap-2 px-6 py-4 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 transition-all font-semibold text-lg">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                        Download TXT
                                    </button>
                                    <button onClick={downloadPDF} className="flex-1 flex items-center justify-center gap-2 px-6 py-4 bg-red-600 text-white rounded-xl hover:bg-red-700 transition-all font-semibold text-lg">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                                        Download PDF
                                    </button>
                                </div>
                            </div>
                        );
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-5xl font-bold text-slate-900 mb-3 tracking-tight">Quote Generator</h1>
                            <p className="text-lg text-slate-600">Streamline your sales process with automated quoting</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                            <div className="bg-gradient-to-r from-emerald-500 to-teal-600 p-6">
                                <div className="flex justify-between items-center max-w-2xl mx-auto">
                                    {['Project Info', 'Select Products', 'Review'].map((label, idx) => (
                                        <div key={idx} className="flex items-center">
                                            <div className={`flex items-center justify-center w-10 h-10 rounded-full font-bold transition-all ${step === idx ? 'bg-white text-emerald-600 scale-110' : step > idx ? 'bg-emerald-700 text-white' : 'bg-emerald-400 text-emerald-100'}`}>
                                                {idx + 1}
                                            </div>
                                            {idx < 2 && <div className={`w-24 h-1 mx-2 ${step > idx ? 'bg-emerald-700' : 'bg-emerald-400'}`} />}
                                        </div>
                                    ))}
                                </div>
                                <div className="text-center mt-4 text-white font-semibold text-lg">{['Project Info', 'Select Products', 'Review'][step]}</div>
                            </div>

                            <div className="p-8">
                                {renderStep()}
                            </div>

                            <div className="bg-slate-50 p-6 flex justify-between border-t border-slate-200">
                                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="flex items-center gap-2 px-6 py-3 bg-slate-200 text-slate-700 rounded-xl hover:bg-slate-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-semibold">
                                    <ChevronLeft className="w-5 h-5" /> Previous
                                </button>
                                
                                {step < 2 ? (
                                    <button onClick={() => { if (step === 0) { autoAddHardware(); } setStep(step + 1); }} disabled={(step === 0 && !quoteData.customerName) || (step === 1 && quoteData.items.length === 0)} className="flex items-center gap-2 px-6 py-3 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-semibold">
                                        Next <ChevronRight className="w-5 h-5" />
                                    </button>
                                ) : (
                                    <button onClick={() => { setStep(0); setQuoteData({ customerName: '', projectName: '', partnerLevel: 'silver', salesRep: '', projectType: '', estimatedDoors: '', mdfLocation: '', numIDFs: '', cabinetVendor: '', autoCalculateHardware: true, useDistributedArchitecture: false, signo20Readers: '', signo40Readers: '', items: [] }); }} className="px-6 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-colors font-semibold">
                                        New Quote
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuotingTool />);
    </script>
</body>
</html>
